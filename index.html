<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0e14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="3PITCH">
  <title>THREE PITCH</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./style.css?v=1">
</head>
<body>
  <main class="app">
    <header class="brand">
      <div class="mini-logo" aria-hidden="true"><i></i><i></i><i></i><b>3P</b></div>
      <div class="brand-copy">
        <p>SHORTEST HARMONY DETECTOR</p>
        <h1>THREE PITCH</h1>
        <span>最短ハモ判定</span>
      </div>
    </header>

    <section class="control-card chord-card">
      <div class="section-title"><span>01</span><div><h2>CHORD</h2><p>コードを選択</p></div></div>
      <div class="label">ROOT</div>
      <div id="rootGrid" class="notes-grid"></div>

      <div class="split-row">
        <div><div class="label">BASE</div><div id="baseGrid" class="choice-grid base-grid"></div></div>
        <div><div class="label">SHAPE</div><div id="shapeGrid" class="choice-grid shape-grid"></div></div>
      </div>

      <div class="label decoration-label">DECORATION</div>
      <div id="decorationGrid" class="decoration-grid"></div>

      <div class="summary"><strong id="chordName">C</strong><span id="chordTones">C · E · G</span></div>
    </section>

    <section class="control-card melody-card">
      <div class="section-title"><span>02</span><div><h2>MELODY</h2><p>主旋律の1音を選択</p></div></div>
      <div id="melodyGrid" class="notes-grid"></div>
    </section>

    <section class="result-card" aria-live="polite">
      <div class="result-kicker">上3度（下5度）</div>
      <div id="resultNote" class="result-note">E</div>
      <div class="rule-chip">最短和音</div>
      <div class="maybe"><span>もしかして？</span><div id="maybeNotes" class="maybe-notes"></div></div>
    </section>
  </main>

  <script src="./app.js?v=1"></script>
  <script>if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js"));}</script>
</body>
</html>
